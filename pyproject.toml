[project]
name = "ai-text-intelligence-api"
version = "0.1.0"
description = "An AI-powered text analysis API built with FastAPI and Anthropic Claude."
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.162.2",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
